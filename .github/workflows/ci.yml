# The engine's gate: every push to main, every PR, and every release (release.yml calls this).
# A caller can pass `ref` to check out a commit other than the event's; on a manual run
# release.yml passes the commit the tag is on, or will be created on.
# `test` builds Motely.slnx (Motely.Wasm included) and runs the whole xunit suite in Release.
# `aot` NativeAOT-publishes Motely.CLI (the trim/AOT gate) and runs one filter on two seeds.
# `wasm` publishes Motely.Wasm with NativeAOT-LLVM and wasm-opt, runs its node:test suite, packs
# the npm tarball and loads that tarball by name under Node.
# `web` builds Motely.Web against that package.
# REWAFFLE_TOKEN: read:packages on rewaffle's GitHub Packages (NuGet and npm). Without it (a PR
# from a fork, or a repo where the secret isn't set) `test` builds Motely.Wasm without
# Bootsharp.FileSystem (-p:MotelyFileSystem=false), and `wasm`/`web`, which need the packages,
# are skipped with a warning in the run summary instead of failing on an empty password.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to check out. Empty: the ref of the event that started the run."
        type: string
        default: ""

permissions:
  contents: read

env:
  REWAFFLE_NUGET: https://nuget.pkg.github.com/rewaffle/index.json
  HAS_REWAFFLE: ${{ secrets.REWAFFLE_TOKEN != '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - if: env.HAS_REWAFFLE == 'true'
        env:
          REWAFFLE_TOKEN: ${{ secrets.REWAFFLE_TOKEN }}
        run: dotnet nuget add source "$REWAFFLE_NUGET" --name rewaffle --username rewaffle --password "$REWAFFLE_TOKEN" --store-password-in-clear-text
      - run: dotnet workload install wasm-tools
      - name: build
        run: |
          fs=$([ "$HAS_REWAFFLE" = "true" ] && echo true || echo false)
          dotnet build Motely.slnx -c Release -p:MotelyFileSystem=$fs
      - run: dotnet test Motely.slnx -c Release --no-build

  aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet publish Motely.CLI -c Release -r linux-x64 -o out/motely
      - run: out/motely/Motely.CLI --jaml legendary-perkeo --seeds ALEEB,PIROCKS --quiet
      - uses: actions/upload-artifact@v5
        with:
          name: motely-linux-x64
          path: out/motely/Motely.CLI

  # Job-level `if:` can't read secrets, so this job turns "is REWAFFLE_TOKEN set" into an output.
  secrets-gate:
    runs-on: ubuntu-latest
    outputs:
      rewaffle: ${{ steps.check.outputs.rewaffle }}
    steps:
      - id: check
        run: |
          echo "rewaffle=$HAS_REWAFFLE" >> "$GITHUB_OUTPUT"
          if [ "$HAS_REWAFFLE" != "true" ]; then
            echo "::warning::REWAFFLE_TOKEN is not set: the wasm and web jobs are skipped, so this run does not test motely-wasm."
            echo "### wasm/web skipped: REWAFFLE_TOKEN is not set" >> "$GITHUB_STEP_SUMMARY"
          fi

  wasm:
    needs: secrets-gate
    if: needs.secrets-gate.outputs.rewaffle == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Motely.Wasm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: "@rewaffle"
      - env:
          REWAFFLE_TOKEN: ${{ secrets.REWAFFLE_TOKEN }}
        run: dotnet nuget add source "$REWAFFLE_NUGET" --name rewaffle --username rewaffle --password "$REWAFFLE_TOKEN" --store-password-in-clear-text
      - run: dotnet workload install wasm-tools
      # Bootsharp runs wasm-opt on a Release publish and only warns when it is missing. The package
      # that ships is the optimized one, so the build step below fails when wasm-opt did not run.
      - name: Install Binaryen 130
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz
          echo "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc  binaryen.tar.gz" | sha256sum --check
          tar -xzf binaryen.tar.gz
          echo "$RUNNER_TEMP/binaryen-version_130/bin" >> "$GITHUB_PATH"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REWAFFLE_TOKEN }}
      - name: Build with wasm-opt
        shell: bash
        run: |
          wasm-opt --version
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -q "Failed to run Binaryen optimization" "$RUNNER_TEMP/build.log"; then
            echo "::error::wasm-opt did not run: this is not the optimized build that ships."
            exit 1
          fi
      - run: npm test
      - uses: actions/upload-artifact@v5
        with:
          name: motely-wasm
          path: Motely.Wasm/bin/motely-wasm
      # The tarball `npm publish` uploads, packed from the build the tests above ran against.
      # release.yml attaches it to the GitHub Release.
      - name: Pack the npm package
        shell: bash
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Load the packed package by name under Node
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init --yes > /dev/null
          npm install "$RUNNER_TEMP"/motely-wasm-*.tgz
          cat > check.mjs <<'EOF'
          import assert from "node:assert/strict";
          import bootsharp, { JamlConfigLoader, JamlSearchBuilder } from "motely-wasm";
          import schema from "motely-wasm/jaml/schema.json" with { type: "json" };
          await import("motely-wasm/jaml");
          await bootsharp.boot();
          const config = JamlConfigLoader.fromJaml("deck: Red\nstake: White\nmust:\n  - voucher: Telescope\n    antes: [1]\n");
          const finds = [];
          const search = JamlSearchBuilder.createSettings(config)
            .withThreadCount(1)
            .withQuietMode(true)
            .withSeedList(["ALEEB", "AAAAAAAA", "PIROCKS"])
            .withSeedMatchCallback((seed) => finds.push(seed))
            .start();
          await search.waitForCompletionAsync();
          assert.equal(search.totalSeedsSearched, 3n);
          assert.equal(BigInt(finds.length), search.matchingSeeds);
          search.dispose();
          assert.equal(typeof schema.definitions, "object");
          console.log(`motely-wasm loads by name: 3 seeds searched, ${finds.length} matched`);
          EOF
          node check.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: motely-wasm-package
          path: ${{ runner.temp }}/motely-wasm-*.tgz
          if-no-files-found: error

  web:
    needs: wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Motely.Web
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: "@rewaffle"
      - uses: actions/download-artifact@v6
        with:
          name: motely-wasm
          path: Motely.Wasm/bin/motely-wasm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REWAFFLE_TOKEN }}
      - run: npm ls
      - name: Install this run's motely-wasm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REWAFFLE_TOKEN }}
        run: |
          tarball=$(cd ../Motely.Wasm && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)
          npm install --no-save "$RUNNER_TEMP/$tarball"
          diff -r ../Motely.Wasm/bin/motely-wasm node_modules/motely-wasm/bin/motely-wasm
      - run: npm run build
