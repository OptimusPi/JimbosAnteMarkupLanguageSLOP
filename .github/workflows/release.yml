# A release is the GitHub Release for a v* tag, made after ci.yml passes on the tag's commit.
# `git tag v29.0.0 && git push --tags` starts this workflow for the pushed tag.
# A manual run takes a tag name.
# - The tag exists: CI runs on the tag's commit, then the tag's release is created or updated.
# - The tag does not exist: CI runs on the head of the ref the run was started from, then the
#   release step creates the tag on that same commit. The name must be v<MotelyVersion> as
#   Directory.Build.props has it on that commit.
# The release body is docs/RELEASE-<version>.md when that file exists, generated notes otherwise.
# On a manual run the file is read from the ref the run was started from, so a correction to the
# notes on main reaches a published release by running this again for the same tag.
# The release carries motely-wasm-<version>.tgz, the npm package that run built, tested and
# packed from the tag's commit. A package already attached to a release is never replaced.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v29.0.0). Created on this ref's head if it does not exist."
        required: true

permissions:
  contents: write

jobs:
  # On a manual run `commit` is the commit CI tests: the tag's commit when the tag exists, the
  # head of the ref the run was started from when it does not. `create` is set in the second case
  # only, to that same commit; the release step creates the tag there. On a tag push both are
  # empty and actions/checkout uses the pushed tag's commit.
  tag:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      create: ${{ steps.resolve.outputs.create }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'
      - name: Resolve the tag
        id: resolve
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag. Write it as v<major>.<minor>.<patch>, e.g. v29.0.0."
            exit 1
          fi
          existing=$(git ls-remote origin "refs/tags/$TAG" | awk -v ref="refs/tags/$TAG" '$2 == ref')
          if [ -n "$existing" ]; then
            git fetch --quiet --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
            echo "commit=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's:.*<MotelyVersion>\(.*\)</MotelyVersion>.*:\1:p' Directory.Build.props)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG does not exist, and it cannot be created here: $GITHUB_SHA is version $version."
            exit 1
          fi
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "create=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.tag.outputs.commit }}
    # ci.yml restores from rewaffle's feeds with REWAFFLE_TOKEN; a called workflow sees no secrets
    # unless they are passed down.
    secrets: inherit

  release:
    needs: [tag, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pick the notes
        id: notes
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes="docs/RELEASE-${TAG#v}.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -f "$notes" ]; then echo "file=$notes" >> "$GITHUB_OUTPUT"; fi
      # The npm tarball ci.yml's `wasm` job built, tested and packed in this run. That job is
      # skipped without REWAFFLE_TOKEN; this step then fails, and nothing is released untested.
      - uses: actions/download-artifact@v6
        with:
          name: motely-wasm-package
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ needs.tag.outputs.create }}
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}
          files: release-assets/motely-wasm-*.tgz
          fail_on_unmatched_files: true
          overwrite_files: false
